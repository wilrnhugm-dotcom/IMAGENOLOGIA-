<style>
  :root {
    --cian: #00B2E3;
    --azul: #10567F;
    --marino: #0B1A2E;
    --ok: #10B981;
    --no: #F43F5E;
    --warn: #F59E0B;
    --fondo: #EEF4F8;
    --tarjeta: rgba(255, 255, 255, .78);
    --borde: rgba(16, 86, 127, .12);
    --texto: #0F2438;
    --tenue: #5B7186;
  }
  .dark {
    --fondo: #050E1A;
    --tarjeta: rgba(13, 30, 50, .62);
    --borde: rgba(94, 208, 240, .14);
    --texto: #E6F1F8;
    --tenue: #8BA3B8;
  }

  html, body { background: var(--fondo); color: var(--texto); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: Montserrat, sans-serif; }
  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ── Fondo animado: auroras + rejilla tipo negatoscopio ── */
  .fondo-app { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  /* Sin filter: blur(): los degradados radiales ya son suaves y el desenfoque obligaba a
     redibujar el fondo completo en cada cuadro (la página bajaba a ~12 fps al escribir). */
  .aurora { position: absolute; border-radius: 50%; opacity: .5; will-change: transform; }
  .dark .aurora { opacity: .35; }
  .aurora.a1 { width: 46vw; height: 46vw; background: radial-gradient(circle, #00B2E3 0%, transparent 70%); top: -14vw; left: -10vw; }
  .aurora.a2 { width: 40vw; height: 40vw; background: radial-gradient(circle, #10567F 0%, transparent 70%); bottom: -16vw; right: -8vw; }
  .aurora.a3 { width: 26vw; height: 26vw; background: radial-gradient(circle, #6366F1 0%, transparent 70%); top: 40%; left: 45%; opacity: .25; }
  .rejilla {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--borde) 1px, transparent 1px), linear-gradient(90deg, var(--borde) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }
  .escaner {
    will-change: transform;
    position: absolute; left: 0; right: 0; height: 160px; top: -160px;
    background: linear-gradient(180deg, transparent, rgba(0, 178, 227, .10) 70%, rgba(0, 178, 227, .35) 99%, transparent);
  }
  .dark .escaner { background: linear-gradient(180deg, transparent, rgba(0, 178, 227, .06) 70%, rgba(94, 208, 240, .28) 99%, transparent); }

  /* ── Vidrio ── */
  .vidrio {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 40px -18px rgba(7, 28, 44, .35);
  }
  .dark .vidrio { box-shadow: 0 10px 40px -12px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .04); }

  .borde-brillo { position: relative; }
  .borde-brillo::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(135deg, rgba(0, 178, 227, .7), transparent 40%, transparent 60%, rgba(16, 86, 127, .7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  .texto-gradiente {
    background: linear-gradient(90deg, #00B2E3, #5ED0F0 40%, #10567F);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .dark .texto-gradiente { background: linear-gradient(90deg, #5ED0F0, #00B2E3 50%, #A5E9FB); -webkit-background-clip: text; background-clip: text; }

  .tenue { color: var(--tenue); }

  /* ── Botones ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    font-weight: 700; border-radius: .9rem; padding: .7rem 1.1rem; transition: transform .15s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
    user-select: none; position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primario { background: linear-gradient(135deg, #00B2E3, #10567F); color: #fff; box-shadow: 0 10px 25px -10px rgba(0, 178, 227, .8); }
  .btn-primario:hover { box-shadow: 0 14px 30px -8px rgba(0, 178, 227, .95); }
  .btn-fantasma { background: transparent; border: 1px solid var(--borde); color: var(--texto); }
  .btn-fantasma:hover { background: rgba(0, 178, 227, .08); }
  .btn-peligro { background: linear-gradient(135deg, #F43F5E, #BE123C); color: #fff; box-shadow: 0 10px 25px -10px rgba(244, 63, 94, .8); }
  .btn-exito { background: linear-gradient(135deg, #10B981, #047857); color: #fff; box-shadow: 0 10px 25px -10px rgba(16, 185, 129, .8); }
  .btn .brillo { position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%); transform: translateX(-120%); pointer-events: none; }

  .ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .45); transform: scale(0); pointer-events: none; }

  /* ── Chips ── */
  .chip {
    display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .85rem; border-radius: 999px; font-size: .78rem; font-weight: 700;
    border: 1px solid var(--borde); color: var(--tenue); background: transparent; white-space: nowrap; transition: all .2s ease;
  }
  .chip:hover { color: var(--texto); border-color: rgba(0, 178, 227, .5); }
  .chip.activo { color: #fff; background: linear-gradient(135deg, #00B2E3, #10567F); border-color: transparent; box-shadow: 0 6px 18px -8px rgba(0, 178, 227, .9); }
  .chip .cuenta { font-family: 'JetBrains Mono', monospace; font-size: .7rem; padding: 0 .4rem; border-radius: 999px; background: rgba(0, 178, 227, .15); }
  .chip.activo .cuenta { background: rgba(255, 255, 255, .22); }

  .insignia { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 700; white-space: nowrap; }

  /* ── Entradas ── */
  .campo {
    width: 100%; background: rgba(255, 255, 255, .7); border: 1px solid var(--borde); color: var(--texto);
    border-radius: .9rem; padding: .75rem 1rem; outline: none; transition: box-shadow .2s ease, border-color .2s ease;
  }
  .dark .campo { background: rgba(5, 14, 26, .6); }
  .campo:focus { border-color: #00B2E3; box-shadow: 0 0 0 4px rgba(0, 178, 227, .18); }
  .campo::placeholder { color: var(--tenue); opacity: .8; }
  select.campo option { color: #0F2438; }

  /* ── Campo de código de acceso (oculto como contraseña, sin que el navegador lo guarde) ── */
  .campo-codigo { font-family: 'JetBrains Mono', monospace; letter-spacing: .35em; text-transform: uppercase; font-weight: 700; }
  .campo-codigo.oculto { -webkit-text-security: disc; text-security: disc; }
  .campo-codigo::placeholder { letter-spacing: normal; text-transform: none; font-family: Inter, sans-serif; font-weight: 500; }
  .error-login { color: #F43F5E; font-size: .8rem; font-weight: 600; min-height: 1.2rem; }

  /* ── Modales y toasts ── */
  .capa-modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 1rem; background: rgba(3, 10, 20, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .capa-modal.abierto { display: flex; }

  #toasts { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 80; display: flex; flex-direction: column; gap: .6rem; align-items: flex-end; }
  .toast { min-width: 260px; max-width: 380px; border-radius: 1rem; padding: .85rem 1rem; display: flex; gap: .75rem; align-items: center; }

  /* ── Pulso en vivo ── */
  .punto-vivo { width: .6rem; height: .6rem; border-radius: 999px; background: #10B981; position: relative; }
  .punto-vivo::after { content: ''; position: absolute; inset: -4px; border-radius: 999px; border: 2px solid #10B981; animation: pulsoVivo 1.8s ease-out infinite; }
  .punto-vivo.desconectado { background: #F43F5E; }
  .punto-vivo.desconectado::after { border-color: #F43F5E; }
  @keyframes pulsoVivo { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

  /* ── Barra de desplazamiento ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0, 178, 227, .25); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0, 178, 227, .45); }

  /* ── Intro ── */
  #intro { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #0B2F47 0%, #050E1A 70%); }
  #intro .anillo { position: absolute; border-radius: 50%; border: 1px solid rgba(0, 178, 227, .35); }
  #intro .barra { width: 220px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  #intro .barra > div { height: 100%; width: 0; background: linear-gradient(90deg, #00B2E3, #5ED0F0); box-shadow: 0 0 12px #00B2E3; }

  .particula { position: fixed; z-index: 90; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }

  .skeleton { background: linear-gradient(90deg, rgba(0, 178, 227, .06), rgba(0, 178, 227, .16), rgba(0, 178, 227, .06)); background-size: 200% 100%; animation: brilloSk 1.4s ease infinite; }
  @keyframes brilloSk { to { background-position: -200% 0; } }

  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
