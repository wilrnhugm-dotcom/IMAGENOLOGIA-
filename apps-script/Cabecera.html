<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          display: ['Montserrat', 'sans-serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace']
        },
        colors: {
          rosales: { 50: '#E6F8FD', 100: '#C2EEFA', 300: '#5ED0F0', 400: '#2CC2EA', 500: '#00B2E3', 600: '#0092BD', 700: '#10567F', 800: '#0D4566', 900: '#0B2F47', 950: '#071C2C' },
          marino: '#1B2A4A'
        }
      }
    }
  };
  try { if (localStorage.getItem('ugm-tema') !== 'light') document.documentElement.classList.add('dark'); } catch (e) { document.documentElement.classList.add('dark'); }
</script>
